spring.application.name=nomadrent
server.port=8080

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:nomadrentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Origen permitido del frontend (CORS)
nomadrent.cors.allowed-origins=http://localhost:5173

# JWT (en producción define NOMADRENT_JWT_SECRET con al menos 32 caracteres)
nomadrent.jwt.secret=${NOMADRENT_JWT_SECRET:nomadrent-dev-secret-change-me-0123456789}
nomadrent.jwt.expiration-minutes=480
